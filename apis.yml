name: Eye Security
description: >-
  Eye Security is a European (Netherlands-founded) cybersecurity company delivering
  enterprise-grade Managed Detection and Response (Managed XDR), 24/7 incident
  response, security awareness training, EU-native log retention (Eye Log), and
  bundled cyber insurance to the mid-market. Rather than building its own detection
  stack, Eye Security combines the human expertise of European security analysts
  with vetted EDR/ITDR technologies, integrating with a customer's existing tech
  stack. Backed by Bessemer Venture Partners. This API Evangelist profile was seeded
  as a VC-portfolio stub under the mis-expanded legacy name "eEye Digital Security";
  the wired domain (eye.security), HackerOne program, and Bessemer backing identify
  the live company as Eye Security. Eye Security operates internal control-plane
  APIs (api.control.eye.security, portal, agent) but publishes no public developer
  API, OpenAPI, or developer portal, so this profile carries identity and security
  posture artifacts rather than API specifications.
